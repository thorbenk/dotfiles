# dotbot configuration file
# 
# See https://github.com/anishathalye/dotbot

- defaults:
    link:
      create: true
      relink: true

- clean:
    - ~/.config

- shell:
    - [git submodule update --init --recursive, Initializing git submodules]
    - description: Installing tools and dependencies
      command: ./install.py
      stdout: true
      stderr: true

- link:
    # ZSH configuration
    ~/.zshrc: zshrc
    ~/.zprofile: zprofile

    # Neovim configuration
    ~/.config/nvim: nvim

    # Tmux configuration
    ~/.tmux.conf: tmux.conf
    ~/.tmux: tmux

    # Zed editor configuration
    ~/.config/zed/tasks.json: zed/tasks.json
    ~/.config/zed/settings.json: zed/settings.json
    ~/.config/zed/keymap.json: zed/keymap.json
    ~/.config/zed/debug.json: zed/debug.json

    # Claude Code
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/statusline.py: claude/statusline.py

    # Bottom (btm)
    ~/.config/bottom/bottom.toml: bottom/bottom.toml

    # Ghostty terminal
    ~/.config/ghostty/config: ghostty/config

    # direnv
    ~/.config/direnv/direnv.toml: direnv/direnv.toml

    # Systemd user services
    ~/.config/systemd/user/ydotoold.service:
      path: services/ydotool/ydotoold.service
      if: '[ "$(hostname)" != "dell-brick" ]'

    
    # Note: install.py handles tool installation (fd, bat, delta, lazygit, nvim, etc.)
    # Run './install.py --check' to see tool versions
    # Run './install.py --update-lock' to update to latest releases

- shell:
    # Copied, not linked: Codex writes per-machine trust entries into it. A
    # symlink is what older checkouts leave behind (the file used to be linked
    # from codex/config.toml); we leave fixing that to a human.
    - description: Seeding ~/.codex/config.toml
      command: |
        target=~/.codex/config.toml
        if [ -L "$target" ]; then
          echo "$target is a symlink ($(readlink "$target")). Replace it with a" >&2
          echo "real file, e.g. a copy of codex/config.base.toml, and rerun." >&2
          exit 1
        fi
        if [ ! -e "$target" ]; then
          mkdir -p ~/.codex && cp codex/config.base.toml "$target"
        fi
    # Generated, not linked: .desktop files can't expand $HOME, so the repo's
    # absolute path is filled in here. Installed both as an app and to
    # autostart. Symlinks are what older checkouts leave behind (these used to
    # be linked); we leave fixing that to a human.
    - description: Generating dictation-indicator.desktop
      command: |
        [ "$(hostname)" != "dell-brick" ] || exit 0
        dotfiles=$(pwd -P)
        escaped=$(printf '%s' "$dotfiles" | sed 's/[&|\\]/\\&/g')
        for target in ~/.local/share/applications/dictation-indicator.desktop \
                      ~/.config/autostart/dictation-indicator.desktop; do
          if [ -L "$target" ]; then
            echo "$target is a symlink ($(readlink "$target")). Remove it and rerun." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$target")"
          sed "s|@DOTFILES_DIR@|$escaped|g" applications/dictation-indicator.desktop.in > "$target.tmp"
          mv "$target.tmp" "$target"
        done
    - description: Installing tmux plugins
      command: |
        if [ -f ~/.tmux/plugins/tpm/bin/install_plugins ]; then
          export TMUX_PLUGIN_MANAGER_PATH='$HOME/.tmux/plugins/'
          ~/.tmux/plugins/tpm/bin/install_plugins
          echo "Tmux plugins installed successfully."
        else
          echo "Warning: tmux plugin manager (tpm) not found. Please ensure git submodules are initialized."
        fi
      stdout: true
      stderr: true
      quiet: true
